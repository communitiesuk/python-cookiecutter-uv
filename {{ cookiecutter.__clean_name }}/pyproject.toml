[project]
name = "{{cookiecutter.__clean_slug}}"
version = "0.0.1"
description = "{{cookiecutter.project_description}}"
authors = [
    { name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}" },
]
readme = "README.md"
license = { file = "LICENCE" }
keywords = ["python"]
requires-python = ">=3.12,<4.0"
classifiers = [
    "{{cookiecutter.development_status}}",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://{{cookiecutter.repository_home}}.github.io/{{cookiecutter.repository_name}}"
Repository = "https://github.com/{{cookiecutter.repository_home}}/{{cookiecutter.repository_name}}"
Documentation = "https://{{cookiecutter.repository_home}}.github.io/{{cookiecutter.repository_name}}"
Issues = "https://github.com/{{cookiecutter.repository_home}}/{{cookiecutter.repository_name}}/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    {%- if cookiecutter.codecov == 'y' %}
    "pytest-cov>=7.0.0",
    {%- endif %}
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    {%- if cookiecutter.typechecker == 'mypy' %}
    "mypy>=1.19.1",
    {%- elif cookiecutter.typechecker == 'ty' %}
    "ty>=0.0.24",
    {%- elif cookiecutter.typechecker == 'pyrefly' %}
    "pyrefly>=0.61.0",
    {%- endif %}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{cookiecutter.__clean_slug}}"]

{% if cookiecutter.typechecker == 'mypy' -%}
[tool.mypy]
files = ["{{cookiecutter.__clean_slug}}"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
{%- elif cookiecutter.typechecker == 'ty' -%}
[tool.ty]
environment.python = "./.venv"
terminal.output-format = "concise"
{%- elif cookiecutter.typechecker == 'pyrefly' -%}
[tool.pyrefly]
project-includes = ["{{cookiecutter.__clean_slug}}"]
python-version = "3.12"
{%- endif %}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E", "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

{% if cookiecutter.codecov == "y" -%}
[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["{{cookiecutter.__clean_slug}}"]
{%- endif %}
