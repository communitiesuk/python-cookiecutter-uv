{#- This is the new, dynamic way to build the OS list -#}
{%- set os_list = [] -%}
{%- if cookiecutter.use_ubuntu == 'y' -%}{%- do os_list.append('ubuntu-latest') -%}{%- endif -%}
{%- if cookiecutter.use_macos == 'y' -%}{%- do os_list.append('macos-latest') -%}{%- endif -%}
{%- if cookiecutter.use_windows == 'y' -%}{%- do os_list.append('windows-latest') -%}{%- endif -%}

name: Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        os: [{{ os_list | map('tojson') | join(', ') }}]

    runs-on: ${{ '{{ matrix.os }}' }}

    defaults:
      run:
        working-directory: .

    name: Python ${{ '{{ matrix.python-version }}' }} on ${{ '{{ matrix.os }}' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the uv environment
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ '{{ matrix.python-version }}' }}

      - name: Run pre-commit
        run: uv run pre-commit run -a --show-diff-on-failure

{% if cookiecutter.include_nox == 'y' %}
      - name: Install nox
        run: uv pip install nox
        shell: bash
      - name: Run nox
        run: nox --pythons ${{ '{{ matrix.python-version }}' }}
        shell: bash
{% endif %}
{% if cookiecutter.include_unit_testing == "y" %}
      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml
{% endif %}