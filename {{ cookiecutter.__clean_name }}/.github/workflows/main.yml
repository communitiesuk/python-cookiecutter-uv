{#- Build OS list dynamically -#}
{%- set os_list = [] -%}
{%- if cookiecutter.use_ubuntu == 'y' -%}{%- do os_list.append('ubuntu-latest') -%}{%- endif -%}
{%- if cookiecutter.use_macos == 'y' -%}{%- do os_list.append('macos-latest') -%}{%- endif -%}
{%- if cookiecutter.use_windows == 'y' -%}{%- do os_list.append('windows-latest') -%}{%- endif -%}

name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: {% raw %}pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}{% endraw %}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests-and-type-check:
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [{{ os_list | map('tojson') | join(', ') }}]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}

      - name: Run tests
        run: uv run python -m pytest tests {% if cookiecutter.codecov == "y" %}--cov --cov-config=pyproject.toml --cov-report=xml{%- endif %}

      - name: Check typing
        run: uv run {% if cookiecutter.typechecker == "mypy" %}mypy{% elif cookiecutter.typechecker == "ty" %}ty check{% else %}pyrefly check{% endif %}

{% if cookiecutter.codecov == "y" %}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: {% raw %}${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}{% endraw %}
        env:
          {% raw %}CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}{% endraw %}
{%- endif %}

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s
